<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Dataset Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Datasets</h2>
        <ul id="dataset-list"></ul>
        <button id="new-dataset-btn">+ New Dataset</button>
    </div>
    <div class="main">
        <h1 id="title">Dashboard</h1>
        <div id="overview" class="card">
            <p>Total Datasets: <span id="total-datasets">0</span></p>
            <p>Total Records: <span id="total-records">0</span></p>
        </div>
        <div id="form-container" class="card hidden"></div>
        <div id="records-container" class="card hidden">
            <input type="text" id="search" placeholder="Search..." />
            <table id="records-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <button id="export-csv">Export CSV</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
